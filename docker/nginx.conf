# YapTier nginx configuration
# Serves the static production build with security headers.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
    }

    # Security headers for all responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Custom not-found page generated by the SEO build plugin
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Long-lived cache for versioned assets
    location ~ ^/assets/.*\.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.svg {
        try_files $uri =404;
    }

    # Serve the app shell at the root
    location = / {
        try_files /index.html =404;
    }

    # Serve generated clean-URL pages and static files; unknown paths return 404
    location / {
        try_files $uri $uri.html =404;
    }
}
